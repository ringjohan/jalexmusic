<!doctype html>
<html lang="{{ page.lang | default: 'en' }}">

<head>
  <meta charset="utf-8">
  <title>{{ page.title | default: site.title }}</title>
  <meta name="description" content="{{ page.description | default: site.description }}">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="preload" as="image" href="/img/studio-purple.jpg" imagesizes="100vw">

  <link rel="alternate" href="{{ page.en_url }}" hreflang="en">
  <link rel="alternate" href="{{ page.sv_url }}" hreflang="sv">
  <link rel="alternate" href="{{ page.xdefault_url | default: page.en_url }}" hreflang="x-default">
  <link rel="canonical" href="{{ page.canonical_url | default: page.en_url }}">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Open+Sans:ital,wght@0,300..800;1,300..800&display=swap"
    rel="stylesheet">

  <link rel="stylesheet" href="/assets/site.css">
</head>

<body>
  {% include header.html %}
  <main>{{ content }}</main>
  {% include footer.html %}
  <script type="text/javascript" async src="/assets/site.js"></script>
</body>

</html>
